[package]
name = "risk_score_worker"
version = "0.1.0"
edition = "2021"
description = "Compute maritime wave/wind risk scores from OFS wave Zarr and emit Zarr output"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zarrs = { version = "0.23.12", default-features = false, features = [
    "blosc",
    "crc32c",
    "filesystem",
    "gzip",
    "ndarray",
    "sharding",
    "transpose",
    "zstd",
] }
